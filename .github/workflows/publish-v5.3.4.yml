name: Publish BMW CarData v5.3.4 (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v5.3.4.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'hcraveiro/bmw-cardata-ha2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out merged v5.3.4 code
        uses: actions/checkout@v4
        with:
          ref: b447644eb5a0d0fade5e211598f573f7df47f979

      - name: Package HACS integration ZIP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          integration = Path("custom_components/cardata")
          manifest = json.loads((integration / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "5.3.4"

          files = sorted(path for path in integration.rglob("*") if path.is_file() and "__pycache__" not in path.parts)
          assert files, "No integration files to package"
          with ZipFile("bmw-cardata-ha.zip", "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(integration))
          with ZipFile("bmw-cardata-ha.zip") as archive:
              assert "manifest.json" in archive.namelist()
              js = archive.read("frontend/bmw-cardata-vehicle-card.js").decode("utf-8")
              assert "tileGridWithAdditional" in js
              assert "border-top: 1px solid var(--divider-color" not in js
          print(f"Packaged {len(files)} integration files")
          PY

      - name: Publish release and HACS asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## v5.3.4 — Seamless additional tiles

          - Additional entity tiles now continue inside the **same two-column quick-info grid** as the built-in BMW tiles, filling the next available cell.
          - Removed the visible divider and extra section spacing.
          - Additional tiles remain available even when `show_buttons: false`.
          - Updated tests and documentation.
          - No BMW backend changes; existing `additional_cards` YAML remains unchanged.

          Install/update via HACS from the fork, or download the attached `bmw-cardata-ha.zip`.
          EOF

          if gh release view v5.3.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refreshing HACS asset"
            gh release upload v5.3.4 bmw-cardata-ha.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v5.3.4 bmw-cardata-ha.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target b447644eb5a0d0fade5e211598f573f7df47f979 \
              --title "BMW CarData v5.3.4 — Seamless additional tiles" \
              --notes-file release-notes.md \
              --latest
          fi
