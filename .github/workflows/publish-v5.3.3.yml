name: Publish BMW CarData v5.3.3 (one-time)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v5.3.3.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'hcraveiro/bmw-cardata-ha'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed v5.3.3 code
        uses: actions/checkout@v4
        with:
          ref: e425cc6abbe64edba88cd32ac3786a50e6b10343

      - name: Package HACS integration ZIP
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          integration = Path("custom_components/cardata")
          manifest = json.loads((integration / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "5.3.3", "Unexpected manifest version"

          files = sorted(path for path in integration.rglob("*") if path.is_file() and "__pycache__" not in path.parts)
          assert files, "No integration files to package"
          with ZipFile("bmw-cardata-ha.zip", "w", ZIP_DEFLATED) as archive:
              for path in files:
                  archive.write(path, path.relative_to(integration))
          with ZipFile("bmw-cardata-ha.zip") as archive:
              assert "manifest.json" in archive.namelist()
              assert "frontend/bmw-cardata-vehicle-card.js" in archive.namelist()
          print(f"Packaged {len(files)} integration files")
          PY

      - name: Publish GitHub Release and asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BMW CarData v5.3.3 — Lovelace additional entity tiles

          - New optional `additional_cards` configuration to display arbitrary Home Assistant entities underneath the standard BMW vehicle tiles.
          - Optional per-tile `name` and `icon`, with automatic friendly-name and icon fallbacks.
          - Uses Home Assistant formatted values, live entity state updates and More Info on tap.
          - Responsive, theme-aware tile layout; optional visual card editor configuration.
          - Existing cards remain compatible without YAML changes.
          - Includes tests and documentation. No changes to the BMW integration backend.

          **HACS:** The attached `bmw-cardata-ha.zip` contains the integration files at the archive root, as required by this repository's `zip_release` configuration.

          Source: https://github.com/hcraveiro/bmw-cardata-ha/pull/1
          EOF

          if gh release view v5.3.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v5.3.3 already exists; uploading the required HACS ZIP asset"
            gh release upload v5.3.3 bmw-cardata-ha.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v5.3.3 bmw-cardata-ha.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target e425cc6abbe64edba88cd32ac3786a50e6b10343 \
              --title "BMW CarData v5.3.3 — Additional entity tiles" \
              --notes-file release-notes.md \
              --latest
          fi
